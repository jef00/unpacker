name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job per OS: test, then build and upload that OS's binary. No job
  # waits for another, so a slow macOS queue never blocks the Windows .exe.
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three images ship a C++ compiler (MSVC / clang / g++) for UnRAR.
        include:
          - { os: windows-latest, artifact: unpacker-windows-x64, file: unpacker.exe }
          - { os: macos-latest, artifact: unpacker-macos-arm64, file: unpacker }
          - { os: ubuntu-latest, artifact: "", file: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --release
      - name: Build release binary
        if: matrix.artifact != ''
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        if: matrix.artifact != ''
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.file }}
