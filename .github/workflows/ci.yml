name: CI

on:
  push:
  pull_request:
  # The "Run workflow" button (Actions → CI): tests, builds and, if ticked,
  # publishes a release of the version in Cargo.toml. Works from a phone.
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release of the version in Cargo.toml
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job per OS: test, then build and upload that OS's binary. No job
  # waits for another, so a slow macOS queue never blocks the Windows .exe.
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three images ship a C++ compiler (MSVC / clang / g++) for UnRAR.
        include:
          - { os: windows-latest, artifact: unpacker-windows-x64.exe, file: unpacker.exe }
          - { os: macos-latest, artifact: unpacker-macos-arm64, file: unpacker }
          # Tests only: the Linux binary comes from `linux-static` below.
          - { os: ubuntu-latest, artifact: "", file: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --release
      - name: Build release binary
        if: matrix.artifact != ''
        run: cargo build --release
      # A plainly named single file, downloadable without unzipping.
      - name: Name it for its platform
        if: matrix.artifact != ''
        shell: bash
        run: cp "target/release/${{ matrix.file }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v7
        if: matrix.artifact != ''
        with:
          path: ${{ matrix.artifact }}
          archive: false

  # A fully static Linux binary (musl): runs on any 64-bit Linux, old
  # distros and NAS boxes included, unlike a binary built on the Ubuntu
  # runner, which needs a glibc at least as new as that runner's.
  #
  # Built in Alpine, whose musl-based g++ links UnRAR's C++ (libstdc++)
  # statically. GitHub's JavaScript actions can't run *inside* an Alpine
  # container, so the container is started by hand.
  linux-static:
    name: linux-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test and build in Alpine (musl)
        run: |
          docker run --rm -v "$PWD":/src -w /src rust:1-alpine sh -euc '
            apk add --no-cache g++ musl-dev
            cargo test --release --locked
            cargo build --release --locked
          '
      - name: Check that it is fully static
        run: |
          file target/release/unpacker
          file target/release/unpacker | grep -qE "static(-pie)? linked"
      - name: Smoke test on the (glibc) host
        run: target/release/unpacker --version
      - name: Name it for its platform
        run: cp target/release/unpacker unpacker-linux-x64
      - uses: actions/upload-artifact@v7
        with:
          path: unpacker-linux-x64
          archive: false

  # Publishes a GitHub release with all three binaries, once every test and
  # build job above has passed. First bump `version` in Cargo.toml and add a
  # section to CHANGELOG.md, then either:
  #
  #   - Actions → CI → Run workflow (creates the tag v<version> itself), or
  #   - git tag v0.2.0 && git push origin v0.2.0
  release:
    name: release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [build, linux-static]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # v8 saves unzipped (`archive: false`) artifacts as plain files.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Work out the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag is $GITHUB_REF_NAME but Cargo.toml says $version"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag is already released. Bump the version in Cargo.toml first."
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No '## [${TAG#v}]' section in CHANGELOG.md"
            exit 1
          fi
      - name: Checksums
        run: |
          cd dist
          ls -l
          test -f unpacker-windows-x64.exe && test -f unpacker-macos-arm64 && test -f unpacker-linux-x64
          sha256sum unpacker-* > SHA256SUMS
          cat SHA256SUMS
      # Creates the tag on this commit when it doesn't exist yet (the button).
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "unpacker ${TAG#v}" \
            --notes-file notes.md
